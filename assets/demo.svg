<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 648" width="1100" height="648" role="img" aria-labelledby="title desc"><title id="title">Run Capsule runtime example: snapshot and original versus changed input verification</title><desc id="desc">Actual snapshot hashes input/voltages.csv, 113 bytes. Original verification succeeds. Editing 1.250 to 1.350 and adding input/notes.txt in a copy yields modified and new entries, exit 1. Original example files remain unchanged.</desc><rect x="0" y="0" width="1100" height="648" rx="20" fill="#f7f9fc"/><rect x="28" y="28" width="5" height="51" rx="2" fill="#4263db"/><text x="49" y="47" font-family="DejaVu Sans Mono,monospace" font-size="11" fill="#65738a" font-weight="600" text-anchor="start">RUN CAPSULE / RUNTIME EXAMPLE</text><text x="48" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#17243b" font-weight="600" text-anchor="start">Same manifest, two verification results</text><rect x="28" y="112" width="514" height="499" rx="16" fill="#fff"/><text x="53" y="148" font-family="DejaVu Sans Mono,monospace" font-size="11" fill="#65738a" font-weight="600" text-anchor="start">01  SNAPSHOT</text><text x="53" y="185" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#17243b" font-weight="600" text-anchor="start">Selected input + configuration</text><rect x="52" y="210" width="465" height="90" rx="12" fill="#f7f9fc"/><path d="M73 228 H97 L108 239 V278 H73 Z M97 228 V239 H108 M81 251 H99 M81 260 H99" fill="none" stroke="#4263db" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="243" font-family="DejaVu Sans Mono,monospace" font-size="16" fill="#17243b" font-weight="500" text-anchor="start">input/voltages.csv</text><text x="125" y="271" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#65738a" font-weight="400" text-anchor="start">113 bytes · 1 selected file</text><text x="53" y="331" font-family="DejaVu Sans Mono,monospace" font-size="10" fi